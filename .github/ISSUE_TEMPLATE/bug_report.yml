name: Bug report
description: Report a reproducible problem in the CPU package or simulator workflows.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CPU package / CLI
        - Task authoring / goals
        - Simulator workflow
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest command, template, or input that demonstrates the problem. Remove credentials and private data.
      placeholder: "1. Run ...\n2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `simvla doctor` output and, for simulator issues, GPU/runtime versions and robot/task IDs.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error or log excerpt
      description: Include only the lines needed to understand the failure.
      render: text
