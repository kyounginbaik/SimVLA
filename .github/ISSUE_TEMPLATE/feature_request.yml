name: Feature request
description: Propose a new task, skill, robot integration, or workflow improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: Describe the user task and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: For a task or skill, include example template steps and the expected success condition.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Assets and validation
      description: State which assets or robot runtime you can use and any test results. Leave blank for CPU-only ideas.
